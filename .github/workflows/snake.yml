name: Contribution snake

on:
  schedule:
    # 00:00 & 12:00 UTC (07:00 & 19:00 giờ VN)
    - cron: "0 0,12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Render snake from the contribution grid
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark
            dist/snake.gif?palette=github-dark

      # Ảnh nằm trên branch `output` của chính repo này -> README trỏ vào file tĩnh,
      # không gọi service ngoài, không dính rate limit.
      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
