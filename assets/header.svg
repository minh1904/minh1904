<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" fill="none" role="img" aria-label="Van Minh - Frontend Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="55%" stop-color="#12162E"/>
      <stop offset="100%" stop-color="#0A0F1F"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="45%" stop-color="#A855F7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="blobA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#8B93FF" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="card">
      <rect x="0" y="0" width="1000" height="260" rx="22"/>
    </clipPath>

    <style>
      .mono { font-family: "SFMono-Regular", "JetBrains Mono", Consolas, "Liberation Mono", Menlo, monospace; }
      .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
      .float-1 { animation: f1 11s ease-in-out infinite; }
      .float-2 { animation: f2 14s ease-in-out infinite; }
      .float-3 { animation: f3  9s ease-in-out infinite; }
      .pulse   { animation: p 3.2s ease-in-out infinite; }
      .blink   { animation: bl 1.05s steps(1) infinite; }
      .rise    { animation: r 1s cubic-bezier(.22,1,.36,1) both; }
      .rise-2  { animation: r 1s cubic-bezier(.22,1,.36,1) .18s both; }
      .rise-3  { animation: r 1s cubic-bezier(.22,1,.36,1) .34s both; }
      @keyframes f1 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(46px,-26px) } }
      @keyframes f2 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-40px,24px) } }
      @keyframes f3 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(26px,30px) } }
      @keyframes p  { 0%,100% { opacity:.35 } 50% { opacity:1 } }
      @keyframes bl { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
      @keyframes r  { from { opacity:0; transform: translateY(14px) } to { opacity:1; transform: translateY(0) } }
      @media (prefers-reduced-motion: reduce) {
        .float-1,.float-2,.float-3,.pulse,.blink,.rise,.rise-2,.rise-3 { animation: none }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#grid)"/>

    <g filter="url(#soft)">
      <circle class="float-1" cx="150" cy="60"  r="120" fill="url(#blobA)"/>
      <circle class="float-2" cx="880" cy="210" r="140" fill="url(#blobB)"/>
      <circle class="float-3" cx="620" cy="20"  r="110" fill="url(#blobC)"/>
    </g>

    <!-- scanline sweep -->
    <rect x="-400" y="0" width="400" height="260" fill="url(#sweep)" opacity="0.12">
      <animate attributeName="x" values="-400;1000" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- ── left: identity ── -->
    <g transform="translate(56, 74)">
      <text class="mono rise" x="0" y="0" font-size="15" fill="#22D3EE" letter-spacing="2.5">
        &lt;/&gt; const developer = {
      </text>

      <text class="sans rise-2" x="0" y="58" font-size="46" font-weight="800" fill="url(#neon)" letter-spacing="-0.5" filter="url(#glow)">
        VĂN MINH
      </text>

      <text class="sans rise-3" x="0" y="92" font-size="19" font-weight="600" fill="#C7D2FE" letter-spacing="4.5">
        FRONTEND ENGINEER
      </text>

      <g class="rise-3">
        <rect x="0" y="106" width="132" height="3" rx="1.5" fill="url(#neon)"/>
        <text class="mono" x="0" y="140" font-size="13.5" fill="#7C8AB8">
          React · Next.js · TypeScript · Tailwind
        </text>
      </g>
    </g>

    <!-- ── right: terminal card ── -->
    <g transform="translate(650, 52)" class="rise-3">
      <rect x="0" y="0" width="300" height="156" rx="14" fill="#0E1326" fill-opacity="0.86" stroke="#2A3358" stroke-width="1"/>
      <rect x="0" y="0" width="300" height="34" rx="14" fill="#151B33" fill-opacity="0.9"/>
      <rect x="0" y="24" width="300" height="10" fill="#151B33" fill-opacity="0.9"/>
      <circle cx="20" cy="17" r="5" fill="#FF5F57"/>
      <circle cx="38" cy="17" r="5" fill="#FEBC2E"/>
      <circle cx="56" cy="17" r="5" fill="#28C840"/>
      <text class="mono" x="80" y="21" font-size="11" fill="#5C6689">~/minh1904</text>

      <text class="mono" x="18" y="62"  font-size="12.5" fill="#7C8AB8">$ <tspan fill="#A5B4FC">whoami</tspan></text>
      <text class="mono" x="18" y="86"  font-size="12.5" fill="#E2E8F0">building pixel-perfect UIs</text>
      <text class="mono" x="18" y="110" font-size="12.5" fill="#7C8AB8">$ <tspan fill="#A5B4FC">focus</tspan> --now</text>
      <text class="mono" x="18" y="134" font-size="12.5" fill="#22D3EE">performance<tspan fill="#4B5578"> · </tspan><tspan fill="#A855F7">DX</tspan><tspan fill="#4B5578"> · </tspan><tspan fill="#6366F1">a11y</tspan></text>
      <rect class="blink" x="205" y="124" width="8" height="14" fill="#22D3EE"/>
    </g>

    <!-- orbiting accents -->
    <g class="pulse">
      <circle cx="470" cy="200" r="3" fill="#22D3EE"/>
      <circle cx="520" cy="44"  r="2.4" fill="#A855F7"/>
      <circle cx="600" cy="230" r="2" fill="#6366F1"/>
      <circle cx="410" cy="30"  r="2.2" fill="#22D3EE"/>
    </g>

    <rect x="0.5" y="0.5" width="999" height="259" rx="22" fill="none" stroke="url(#neon)" stroke-opacity="0.45" stroke-width="1"/>
  </g>
</svg>
