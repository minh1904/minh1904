<svg xmlns="http://www.w3.org/2000/svg" width="920" height="140" viewBox="0 0 920 140" fill="none" role="img" aria-label="Hello World, I'm Van Minh — Frontend Engineer · Hanoi, VN · available for freelance and part-time">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .hello { font-size: 30px; font-weight: 600; letter-spacing: -0.6px; fill: #0D1117; }
    .place { font-size: 11px; letter-spacing: 0.8px;  fill: #8C959F; }
    .role  { font-size: 12px; font-weight: 500; letter-spacing: 2.6px; fill: #59636E; }
    .avail { font-size: 11px; fill: #59636E; }
    .rule  { stroke: #E1E4E8; stroke-width: 1; }
    .dot   { fill: #2DA44E; }
    .pulse { animation: p 2.4s ease-in-out infinite; transform-origin: 3.5px 3.5px; }
    @keyframes p { 0%, 100% { opacity: .35; transform: scale(1) } 50% { opacity: .12; transform: scale(2.2) } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: 0 } }
    @media (prefers-color-scheme: dark) {
      .hello { fill: #E6EDF3; }
      .place { fill: #6E7681; }
      .role  { fill: #8B949E; }
      .avail { fill: #8B949E; }
      .rule  { stroke: #21262D; }
      .dot   { fill: #3FB950; }
    }
  </style>

  <text class="hello" x="0" y="44">Hello World, I&#39;m Van Minh</text>
  <text class="mono place" x="920" y="42" text-anchor="end">HANOI, VN  ·  GMT+7</text>

  <text class="mono role" x="1" y="76">FRONTEND ENGINEER</text>

  <g transform="translate(9, 100)">
    <circle class="dot pulse" cx="3.5" cy="3.5" r="3.5"/>
    <circle class="dot"       cx="3.5" cy="3.5" r="3.5"/>
    <text class="mono avail" x="16" y="7.5">Available for freelance &amp; part-time</text>
  </g>

  <line class="rule" x1="0" y1="130" x2="920" y2="130"/>
</svg>
