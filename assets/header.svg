<svg xmlns="http://www.w3.org/2000/svg" width="920" height="132" viewBox="0 0 920 132" fill="none" role="img" aria-label="Van Minh - Frontend Engineer">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .name { font-size: 34px; font-weight: 700; letter-spacing: -0.6px; fill: #1F2328; }
    .role { font-size: 14px; font-weight: 500; letter-spacing: 3px; fill: #656D76; }
    .meta { font-size: 12px; fill: #8C959F; }
    .rule { stroke: #D0D7DE; stroke-width: 1; }
    .caret { fill: #656D76; animation: blink 1.15s steps(1) infinite; }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .caret { animation: none } }
    @media (prefers-color-scheme: dark) {
      .name  { fill: #E6EDF3; }
      .role  { fill: #8B949E; }
      .meta  { fill: #7D8590; }
      .rule  { stroke: #30363D; }
      .caret { fill: #8B949E; }
    }
  </style>

  <text class="name" x="0" y="46">Văn Minh</text>
  <rect class="caret" x="176" y="24" width="3" height="26"/>

  <text class="role" x="2" y="74">FRONTEND ENGINEER</text>

  <line class="rule" x1="0" y1="96" x2="920" y2="96"/>

  <text class="mono meta" x="0" y="118">React · Next.js · TypeScript · Tailwind</text>
  <text class="mono meta" x="920" y="118" text-anchor="end">Vietnam</text>
</svg>
